name: revisor
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  aprovar:
    name: gate/revisor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aprova o PR com o bot do Actions
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr review "$PR" --repo "$REPO" --approve --body "Aprovação do bot do Actions (ensaio)."
  automerge-pelo-bot:
    name: gate/automerge-pelo-bot
    if: contains(github.event.pull_request.title, '[auto-bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Liga o merge automático com o token do Actions
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash
